name: Unit Tests (LUnit, nordlug)

# Integration-test workflow for antsundq/lunit-integration-test.
# Runs LUnit headlessly on the self-hosted 'nordlug' runner by docker-running the
# locally-built worker image (lvci-worker:2026, LUnit baked in), instead of the
# stock GHCR-pull path. Mirrors the verified sandbox run (astemes/nordlug-ci-setup-demo).
on:
  push:
    branches: ['**']
    tags-ignore: ['**']
  workflow_dispatch:

concurrency:
  group: nordlug
  cancel-in-progress: false

jobs:
  lunit:
    runs-on: [self-hosted, nordlug]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run LUnit headlessly in the worker container
        shell: powershell
        run: |
          docker run --rm `
            -e "GITHUB_REPOSITORY=${{ github.repository }}" `
            -v "${{ github.workspace }}:C:\workspace" `
            lvci-worker:2026 `
            powershell -NonInteractive -ExecutionPolicy Bypass `
              -File "C:\workspace\.github\labview\run-unit-tests.ps1" `
              -WorkspaceRoot  "C:\workspace" `
              -ResultsDir     "C:\workspace\ci-out\unit-tests\results" `
              -LabVIEWVersion "2026" `
              -LabVIEWPath    "C:\Program Files\National Instruments\LabVIEW 2026\LabVIEW.exe"
          if ($LASTEXITCODE -ne 0) { throw "run-unit-tests.ps1 exited $LASTEXITCODE" }

      - name: Evaluate JUnit results
        shell: powershell
        run: |
          $results = "${{ github.workspace }}\ci-out\unit-tests\results"
          $xmls = Get-ChildItem $results -Filter *.xml -ErrorAction SilentlyContinue
          if (-not $xmls) { throw "No JUnit XML was produced under $results." }
          $tests = 0; $failures = 0; $errors = 0
          foreach ($x in $xmls) {
            [xml]$doc = Get-Content -LiteralPath $x.FullName
            foreach ($ts in $doc.SelectNodes('//testsuite')) {
              $tests    += [int]($ts.tests    | ForEach-Object { $_ })
              $failures += [int]($ts.failures | ForEach-Object { $_ })
              $errors   += [int]($ts.errors   | ForEach-Object { $_ })
            }
          }
          Write-Host "LUnit: tests=$tests failures=$failures errors=$errors"
          if ($failures -gt 0 -or $errors -gt 0) { throw "LUnit reported $failures failure(s), $errors error(s)." }
          Write-Host "All LUnit tests passed."
