name: Verify Unit Tests Action

on:
  push:
    branches: [ verify/unit-tests-action ]
  workflow_dispatch: {}

jobs:
  unit-tests:
    runs-on: windows-2022   # windows-latest = Server 2025, broken Docker daemon
    steps:
      - uses: actions/checkout@v4

      - uses: antsundq/LabVIEW-CI-with-Containers/actions/unit-tests@main
        id: ut
        with:
          image: ghcr.io/antsundq/lunit-integration-test-labview:2026
          framework: lunit
          test-dir: tests
          labview-version: '2026'

      - name: Print result summary
        shell: bash
        run: |
          echo "report-exists=${{ steps.ut.outputs.report-exists }}"
          echo "tests=${{ steps.ut.outputs.tests }}"
          echo "passed=${{ steps.ut.outputs.passed }}"
          echo "failed=${{ steps.ut.outputs.failed }}"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-tests-report
          path: ci-out/unit-tests
